name: Release Creation

# Regenerates the compiled LevelDB compendium packs from the JSON source and
# attaches a ready-to-install module archive to a published GitHub Release.
#
# The repository stores compendiums as JSON directly inside
# `dnd5e_classpack/packs/<name>/`. On release, the Foundry VTT CLI compiles each
# pack back to LevelDB (`fvtt package pack`) and the module is zipped for
# Foundry's Data/modules/ directory.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the archive to. Leave empty to build the archive without attaching.'
        required: false
        default: ''
      keep_all_icons:
        description: 'Include unused legacy Nicons images for existing world and actor copies.'
        type: boolean
        required: false
        default: false
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Foundry VTT CLI
        run: npm install -g @foundryvtt/foundryvtt-cli

      # Read references while pack JSON and embedded macros are still available.
      - name: Plan release icons
        run: node tools/release-icons.mjs --plan reports/release-icons.json

      # Update module.json in the working tree so the release archive and the
      # standalone manifest carry the correct version and point at this repo's
      # release assets. The committed module.json in the repository is left
      # untouched; it is regenerated here for each release.
      - name: Generate module.json manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const file = "dnd5e_classpack/module.json";
          const data = JSON.parse(fs.readFileSync(file, "utf8"));
          const tag = process.env.RELEASE_TAG || "";
          const version = tag.replace(/^v/i, "");
          if (version) data.version = version;
          const base = `https://github.com/${process.env.REPO}/releases`;
          // Prereleases use their own manifest because GitHub's latest excludes them.
          const prerelease = version.includes("-") || data.version.includes("-");
          data.manifest = prerelease && tag
            ? `${base}/download/${tag}/module.json`
            : `${base}/latest/download/module.json`;
          data.download = tag
            ? `${base}/download/${tag}/dnd5e_classpack.zip`
            : `${base}/latest/download/dnd5e_classpack.zip`;
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
          console.log(`module.json: version=${data.version} download=${data.download}`);
          EOF

      # Bundle the split API source (scripts/api/*.mjs imported by
      # scripts/api.mjs) into a single scripts/api.mjs for the release archive.
      # The repository keeps the implementation split for maintainability; the
      # release ships one self-contained ES module.
      - name: Bundle API module
        working-directory: dnd5e_classpack
        run: |
          npx --yes esbuild scripts/api.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=scripts/api.bundled.mjs
          mv scripts/api.bundled.mjs scripts/api.mjs
          node --check scripts/api.mjs
          rm -rf scripts/api

      # Compile every pack from the JSON source. `--inputDirectory` points at the
      # pack's JSON, which may be organized into Folder subdirectories; the
      # `--recursive` flag descends into those. `--outputDirectory` places the
      # compiled LevelDB files in the same pack directory (packs/<name>/).
      - name: Pack compendium packs to LevelDB
        working-directory: dnd5e_classpack
        run: |
          set -e
          for pack in packs/*/; do
            name="$(basename "$pack")"
            echo "Packing ${name} ..."
            fvtt package pack -n "$name" \
              --inputDirectory "${pack%/}" \
              --outputDirectory "packs" \
              --recursive
          done

      # Remove the JSON source from the release build so only the compiled packs
      # ship. The JSON remains tracked in git.
      - name: Remove JSON source from release build
        run: find dnd5e_classpack/packs -name '*.json' -delete

      # The archive must contain the module at its root so it can be extracted
      # straight into Foundry's Data/modules/ directory.
      - name: Stage module archive
        env:
          KEEP_ALL_ICONS: ${{ inputs.keep_all_icons && 'true' || 'false' }}
        run: |
          args=()
          if [ "$KEEP_ALL_ICONS" = "true" ]; then args+=(--keep-all-icons); fi
          node tools/release-icons.mjs --plan reports/release-icons.json --stage build/release "${args[@]}"

      - name: Build module archive
        working-directory: build/release
        run: zip -r ../../dnd5e_classpack.zip dnd5e_classpack

      # For manual runs, upload the archive as a workflow artifact so it can be
      # downloaded from the Actions run page. Release runs attach it to the
      # release instead, so this is skipped there.
      - name: Upload archive artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dnd5e_classpack
          path: dnd5e_classpack.zip
          if-no-files-found: error

      # Attach the archive and the manifest to the release (or to the tag
      # supplied via a manual workflow_dispatch run). Skipped for manual runs
      # that omit the tag.
      - name: Attach release assets
        if: ${{ github.event_name == 'release' || inputs.tag != '' }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ github.event.release.tag_name || inputs.tag }}
          omitName: true
          omitBody: true
          prerelease: ${{ github.event.release.prerelease || contains(github.event.release.tag_name || inputs.tag, '-') }}
          omitPrereleaseDuringUpdate: true
          artifacts: dnd5e_classpack.zip,dnd5e_classpack/module.json
          token: ${{ secrets.GITHUB_TOKEN }}
